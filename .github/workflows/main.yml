name: Build محل العرض 30 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PSShop_Standalone_Project-32.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o PSShop_Standalone_Project-30.zip -d /tmp/source
          ROOT="$(find /tmp/source -name settings.gradle -type f | head -1 | xargs dirname)"
          cp -a "$ROOT"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PSShop-Standalone-30-APK
          path: app/build/outputs/apk/debug/app-debug.apk
