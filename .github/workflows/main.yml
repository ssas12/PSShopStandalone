name: Build محل العرض 33 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PSShop_Standalone_Project-36-Voice-Fix.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=./PSShop_Standalone_Project-33.zip
          test -f "$ZIP" || exit 1
          mkdir -p /tmp/psshop-source
          unzip -o "$ZIP" -d /tmp/psshop-source
          SETTINGS="$(find /tmp/psshop-source -name settings.gradle -type f -print -quit)"
          test -n "$SETTINGS" || exit 1
          ROOT="$(dirname "$SETTINGS")"
          cp -a "$ROOT"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PSShop-Standalone-33-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
